[project]
name = "docflow-agent"
version = "0.1.0"
description = "AI document automation: turn invoices, receipts and contracts (PDF, email) into validated, structured data with a human review queue."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Faizan Reza" }]
dependencies = [
    "pydantic>=2.6",
    "pypdf>=4.0",
    "python-dateutil>=2.9",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "anthropic>=0.70",
]

[project.optional-dependencies]
app = ["streamlit>=1.35", "pandas>=2.2"]
ocr = ["pytesseract>=0.3", "pillow>=10.0"]
sheets = ["gspread>=6.0"]
openai = ["openai>=1.30"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "reportlab>=4.0", "types-python-dateutil"]

[project.scripts]
docflow = "docflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docflow"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
files = ["docflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
